<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="1000" height="560" fill="#ffffff"/>

  <!-- Developer -->
  <rect x="20" y="70" width="130" height="60" rx="6" fill="#f1f3f4" stroke="#5f6368"/>
  <text x="85" y="105" text-anchor="middle" font-size="15">Developer</text>

  <!-- Bitbucket -->
  <rect x="210" y="70" width="150" height="60" rx="6" fill="#f1f3f4" stroke="#5f6368"/>
  <text x="285" y="97" text-anchor="middle" font-size="15" font-weight="bold">Bitbucket</text>
  <text x="285" y="117" text-anchor="middle" font-size="12">source code</text>

  <!-- Bamboo VM -->
  <rect x="420" y="20" width="560" height="270" rx="8" fill="#fafafa" stroke="#5f6368" stroke-dasharray="6 4"/>
  <text x="440" y="45" font-size="15" font-weight="bold">Bamboo (VM)</text>

  <rect x="440" y="70" width="230" height="70" rx="6" fill="#f1f3f4" stroke="#5f6368"/>
  <text x="555" y="98" text-anchor="middle" font-size="14" font-weight="bold">Build plan</text>
  <text x="555" y="118" text-anchor="middle" font-size="12">existing CI: build image</text>

  <rect x="730" y="70" width="230" height="70" rx="6" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="845" y="98" text-anchor="middle" font-size="14" font-weight="bold">Deployment project</text>
  <text x="845" y="118" text-anchor="middle" font-size="12">environment "nkp"</text>

  <rect x="730" y="195" width="230" height="70" rx="6" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="845" y="223" text-anchor="middle" font-size="14" font-weight="bold">Bamboo agent</text>
  <text x="845" y="243" text-anchor="middle" font-size="12">bamboo-deploy.sh + kubectl</text>

  <!-- Harbor -->
  <rect x="440" y="370" width="230" height="80" rx="6" fill="#f1f3f4" stroke="#5f6368"/>
  <text x="555" y="400" text-anchor="middle" font-size="15" font-weight="bold">Harbor</text>
  <text x="555" y="422" text-anchor="middle" font-size="12">ajb-hr/be:&lt;commit-sha&gt;</text>

  <!-- NKP -->
  <rect x="730" y="350" width="250" height="190" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="750" y="377" font-size="15" font-weight="bold">NKP cluster</text>
  <rect x="750" y="392" width="210" height="130" rx="6" fill="#ffffff" stroke="#1a73e8"/>
  <text x="765" y="415" font-size="12">namespace &lt;ns&gt;</text>
  <rect x="770" y="428" width="170" height="40" rx="4" fill="#f8f9fa" stroke="#5f6368"/>
  <text x="855" y="453" text-anchor="middle" font-size="12">Deployment &lt;app&gt;</text>
  <circle cx="815" cy="495" r="12" fill="#ffffff" stroke="#5f6368"/>
  <circle cx="855" cy="495" r="12" fill="#ffffff" stroke="#5f6368"/>
  <text x="900" y="499" text-anchor="middle" font-size="12">pods</text>

  <!-- Arrows -->
  <line x1="150" y1="100" x2="208" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="179" y="92" text-anchor="middle" font-size="13" font-weight="bold">1</text>

  <line x1="360" y1="100" x2="438" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="399" y="92" text-anchor="middle" font-size="13" font-weight="bold">2</text>

  <line x1="555" y1="140" x2="555" y2="368" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="567" y="260" font-size="13" font-weight="bold">3</text>

  <line x1="670" y1="105" x2="728" y2="105" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="699" y="97" text-anchor="middle" font-size="13" font-weight="bold">4</text>

  <line x1="845" y1="140" x2="845" y2="193" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="845" y1="265" x2="845" y2="390" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="857" y="320" font-size="13" font-weight="bold">5</text>
  <text x="857" y="337" font-size="11" fill="#5f6368">port 6443</text>

  <line x1="670" y1="440" x2="768" y2="448" stroke="#333" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="719" y="430" text-anchor="middle" font-size="13" font-weight="bold">6</text>

  <!-- Legend -->
  <rect x="20" y="345" width="16" height="16" fill="#f1f3f4" stroke="#5f6368"/>
  <text x="44" y="358" font-size="12">already in place</text>
  <rect x="20" y="371" width="16" height="16" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="44" y="384" font-size="12">set up for CD (this repo)</text>

  <text x="20" y="425" font-size="12">1  Developer pushes code</text>
  <text x="20" y="446" font-size="12">2  Bamboo starts the build</text>
  <text x="20" y="467" font-size="12">3  Build pushes the image to Harbor</text>
  <text x="20" y="488" font-size="12">4  Build OK: new release (commit SHA)</text>
  <text x="20" y="509" font-size="12">5  Agent runs kubectl set image</text>
  <text x="20" y="530" font-size="12">6  NKP pulls the image from Harbor</text>
</svg>

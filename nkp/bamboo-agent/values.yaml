# Values for the Atlassian Helm chart atlassian-data-center/bamboo-agent
# (installed by `make nkp-agent`; use the same chart version as the server).
# An init container downloads kubectl (deploy) and crane (check Docker Hub for
# CI's image) and registers them as agent capabilities. kubectl in the pod uses
# the bamboo-agent service account (nkp/bamboo-agent/rbac.yaml).

serviceAccount:
  create: false
  name: bamboo-agent

agent:
  server: bamboo.bamboo.svc.cluster.local   # in-cluster Service of the server
  serverProtocol: http
  securityToken:
    secretName: bamboo-security-token
  resources:
    container:
      requests: { cpu: 250m, memory: 1Gi }
      limits:   { cpu: "1",  memory: 2Gi }
  additionalVolumeMounts:
    - name: tools
      mountPath: /usr/local/bin/kubectl
      subPath: kubectl
    - name: tools
      mountPath: /usr/local/bin/crane
      subPath: crane
    - name: tools
      mountPath: /var/atlassian/application-data/bamboo-agent/bin/bamboo-capabilities.properties
      subPath: bamboo-capabilities.properties

additionalInitContainers:
  - name: tools
    image: docker.io/atlassian/bamboo-agent-base:12.1.12    # chart's appVersion
    command: ["bash", "-euo", "pipefail", "-c"]
    args:
      - |
        # kubectl must be within one minor version of the cluster
        curl -fsSLo /tools/kubectl "https://dl.k8s.io/release/v1.33.5/bin/linux/amd64/kubectl"
        curl -fsSL "https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz" \
          | tar xz -C /tools crane
        chmod +x /tools/kubectl /tools/crane
        # Start from the image's capabilities file and add ours.
        caps=/tools/bamboo-capabilities.properties
        cp "${BAMBOO_AGENT_HOME}/bin/bamboo-capabilities.properties" "${caps}"
        /bamboo-update-capability.sh kubectl /usr/local/bin/kubectl "${caps}"
        /bamboo-update-capability.sh crane /usr/local/bin/crane "${caps}"
    volumeMounts:
      - name: tools
        mountPath: /tools

volumes:
  additional:
    - name: tools
      emptyDir: {}

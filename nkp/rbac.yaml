# The identity Bamboo deploys as. It may only manage workloads in one
# namespace; it cannot create namespaces or touch anything else in the cluster.
# NAMESPACE_PLACEHOLDER is replaced by nkp/setup.sh.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bamboo-deployer
  namespace: NAMESPACE_PLACEHOLDER
---
# Long-lived token for the kubeconfig that nkp/setup.sh writes for Bamboo.
apiVersion: v1
kind: Secret
metadata:
  name: bamboo-deployer-token
  namespace: NAMESPACE_PLACEHOLDER
  annotations:
    kubernetes.io/service-account.name: bamboo-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bamboo-deployer
  namespace: NAMESPACE_PLACEHOLDER
rules:
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ["apps"]
    resources: [replicasets]
    verbs: [get, list, watch]                  # rollout status / undo
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]                  # debugging failed rollouts
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bamboo-deployer
  namespace: NAMESPACE_PLACEHOLDER
subjects:
  - kind: ServiceAccount
    name: bamboo-deployer
    namespace: NAMESPACE_PLACEHOLDER
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bamboo-deployer

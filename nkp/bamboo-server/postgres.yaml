# PostgreSQL for the Bamboo server (single instance, official image).
# Credentials come from secret bamboo-db, created once by `make nkp-bamboo`.
apiVersion: v1
kind: Service
metadata:
  name: bamboo-db
  namespace: bamboo
spec:
  selector:
    app: bamboo-db
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bamboo-db
  namespace: bamboo
  labels:
    app: bamboo-db
spec:
  serviceName: bamboo-db
  replicas: 1
  selector:
    matchLabels:
      app: bamboo-db
  template:
    metadata:
      labels:
        app: bamboo-db
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16
          env:
            - name: POSTGRES_DB
              value: bamboo
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: bamboo-db, key: username }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: bamboo-db, key: password }
            - name: PGDATA                  # subdir: the volume root has lost+found
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d bamboo"]
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits:   { memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi

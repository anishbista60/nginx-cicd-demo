# Bamboo Specs (YAML) — CD for nginx-cicd-demo
#
# Plan NGX-CICD:  polls the GitHub repo; for each new commit on main it waits
#                 until GitHub Actions has pushed docker.io/anish60/...:sha-<commit>,
#                 then publishes a "release" artifact (image.env + manifests).
# Deployment:     on a successful plan build, deploys that release to the
#                 NKP cluster (environment "nkp"). Jobs run on the Bamboo agent
#                 pod inside NKP (nkp/bamboo-agent/), which provides the
#                 kubectl and crane capabilities.
#
# IMAGE_REPO below points at the Docker Hub repo anish60/nginx-cicd-demo.
---
version: 2
plan:
  project-key: NGX
  key: CICD
  name: nginx-cicd-demo

repositories:
  - nginx-cicd-demo:
      scope: global          # linked repository created in Bamboo UI (see README)

branches:
  create: manually

triggers:
  - polling:
      period: 60

variables:
  image_repo: docker.io/anish60/nginx-cicd-demo
  wait_timeout: 900

stages:
  - Verify CI image:
      manual: false
      final: false
      jobs:
        - Wait for image

Wait for image:
  requirements:
    - crane                  # capability of the agent pod (nkp/bamboo-agent/)
  tasks:
    - checkout:
        force-clean-build: true
    - script:
        interpreter: SHELL
        scripts:
          - |-
            set -euo pipefail
            export GIT_REVISION="${bamboo_planRepository_revision}"
            export IMAGE_REPO="${bamboo_image_repo}"
            export TIMEOUT_SEC="${bamboo_wait_timeout}"
            bash scripts/wait-for-image.sh
  artifacts:
    - name: release
      location: .
      pattern: 'release/**,k8s/**,scripts/**'
      shared: true
      required: true

---
version: 2
deployment:
  name: nginx-cicd-demo deploy
  source-plan: NGX-CICD

release-naming:
  next-version-name: ${bamboo.planRepository.revision}
  applies-to-branches: false

environments:
  - nkp

nkp:
  description: NKP cluster, namespace nginx-demo (deployed by the in-cluster agent)
  triggers:
    - build-success           # auto-deploy after every green plan build
  variables:
    smoke_url: http://nginx-demo.nginx-demo.svc.cluster.local
    ingress_class: kommander-traefik
    # Add ingress_host (e.g. nginx-demo.apps.example.com) to also create an Ingress.
  requirements:
    - kubectl
  tasks:
    - clean
    - artifact-download:
        destination: .
    - script:
        interpreter: SHELL
        scripts:
          - |-
            set -euo pipefail
            chmod +x scripts/*.sh
            export SMOKE_URL="${bamboo_smoke_url}"
            export INGRESS_HOST="${bamboo_ingress_host:-}"
            export INGRESS_CLASS="${bamboo_ingress_class}"
            ./scripts/cd-deploy.sh release/image.env

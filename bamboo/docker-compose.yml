# Bamboo Data Center server (needs a trial/dev license from my.atlassian.com).
# Builds and deployments run on the agent pod inside NKP (nkp/bamboo-agent/),
# so the NKP nodes must be able to reach this host on 8085 and 54663.
# Keep the version in sync with the agent images in nkp/bamboo-agent/agent.yaml.
services:
  bamboo:
    image: atlassian/bamboo:11.0.7
    container_name: bamboo
    ports:
      - "8085:8085"     # web UI + agent HTTP
      - "54663:54663"   # remote agent broker
    environment:
      - JVM_MAXIMUM_MEMORY=2048m
    volumes:
      - bamboo-data:/var/atlassian/application-data/bamboo
    restart: unless-stopped

volumes:
  bamboo-data:

# Applied only when INGRESS_HOST is set (see scripts/deploy.sh).
# NKP ships Traefik with ingress class "kommander-traefik".
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-demo
  namespace: nginx-demo
spec:
  ingressClassName: INGRESS_CLASS_PLACEHOLDER
  rules:
    - host: INGRESS_HOST_PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-demo
                port:
                  name: http
